<title>Ассеты регионов LR-167</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one column of review sections; each a grid of sprites on their own ground, scenes full width */
:root{--bg:#efeadf;--panel:#fbf8f1;--fg:#28231c;--muted:#6b6255;--line:#d6cdbb;--accent:#8e3b1f;
  --font-head:'Space Grotesk','Inter',system-ui,sans-serif;--font-body:'Inter',system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#181511;--panel:#221e18;--fg:#ebe3d3;--muted:#a3988a;--line:#3b3429;--accent:#e08458;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#181511;--panel:#221e18;--fg:#ebe3d3;--muted:#a3988a;--line:#3b3429;--accent:#e08458;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body);padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:1200px;margin:0 auto}
h1{font:700 28px/1.2 var(--font-head);margin:0 0 6px;text-wrap:balance}
h2{font:700 20px/1.25 var(--font-head);margin:0 0 4px;text-wrap:balance}
section{margin-top:36px}
.lead,.note{color:var(--muted);max-width:72ch;margin:0 0 12px}
.lead{color:var(--fg)}
img{image-rendering:pixelated;display:block;max-width:100%;height:auto}
figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
figcaption{font-size:13px;color:var(--muted)}
.scenes{display:grid;gap:24px}
.scene img{width:100%;max-width:1536px;border:1px solid var(--line)}
.scene figcaption{font-size:14px;color:var(--fg);max-width:90ch}
.g{display:flex;flex-wrap:wrap;gap:14px 16px;align-items:flex-end}
.g figure{background:var(--panel);border:1px solid var(--line);padding:6px}
.icons figure{background:transparent;border:0;padding:0;align-items:center}
.walls figure{flex-direction:row;align-items:center;gap:12px}
.walls figcaption{color:var(--fg)}
</style>
<main>
<h1>Ассеты регионов LR-167</h1>
<p class="lead">Перерисовка в стиле пилот-листа: детальный пиксель-арт, свет сверху слева в три тона, цветной контур. Это черновик на согласование, в игру пока ничего не влито.</p>
<!--BODY-->
</main>
